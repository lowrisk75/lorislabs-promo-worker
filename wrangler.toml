name = "lorislabs-promo-worker"
main = "src/index.js"
compatibility_date = "2026-04-25"
compatibility_flags = ["nodejs_compat"]

# Custom route — adjust after creating DNS for r.lorislab.fr
# routes = [
#   { pattern = "lorislab.fr/r/*", zone_name = "lorislab.fr" }
# ]

# KV namespace bound as PROMO_CODES
# Create with: wrangler kv:namespace create PROMO_CODES
# Then put the returned id below.
[[kv_namespaces]]
binding = "PROMO_CODES"
id = "25b9b4e8368d46989057e6052db3e120"
preview_id = "52e6f88673424267b706ab1895bddc60"

# Public envs (non-secret)
#
# This worker is multi-app: each channel's `meta:<channel>` JSON carries
# its own `appName` + `appASCID`, so we no longer need APP_NAME / APP_ASC_ID
# as global vars. Adding a new app means uploading new channels via the
# scripts/bulk-upload-all.sh template — no redeploy needed.
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAADDRP5yDHt5deace"
# CLAIM_SCOPE: "global" (default — one code per IP across ALL channels per 24h, max security)
#              "channel" (one code per IP per channel per 24h — looser, allows multi-claim across channels)
CLAIM_SCOPE = "global"

# Secrets — set with: wrangler secret put TURNSTILE_SECRET
# (do NOT commit the secret — it's bound at deploy time)

# Optional observability
# [observability]
# enabled = true
